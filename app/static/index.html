<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunchbox Quote</title>
  <style>
    :root { --bg: #f7f6f3; --card: #ffffff; --text: #1f2328; --muted: #5b616b; --line: #d9dce1; --accent: #1d6f5c; --warn-bg: #fff4d6; --warn-text: #6b4b00; --err: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: 0.95rem; }
    label span { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
    input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; width: 100%; background: #fff; }
    button { font: inherit; font-weight: 600; padding: 10px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; justify-self: start; }
    button:disabled { opacity: 0.6; cursor: wait; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 8px 0; border-bottom: 1px solid var(--line); }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    tr.total td { font-weight: 700; border-bottom: 0; font-size: 1.1rem; }
    .banner { background: var(--warn-bg); color: var(--warn-text); padding: 8px 12px; border-radius: 6px; font-weight: 600; margin-bottom: 12px; }
    pre { white-space: pre-wrap; font: inherit; margin: 0; }
    .error { color: var(--err); font-weight: 600; }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Lunchbox Quote</h1>
    <p class="sub">Heicoders Catering weekday lunchboxes. Prices come from rates-lunchbox.json. Drafts are for Priya Menon's approval and are never sent.</p>

    <section class="card">
      <form id="quote-form">
        <label>Boxes
          <input id="boxes" name="boxes" type="number" min="20" step="1" required>
        </label>
        <label>Delivery date
          <input id="delivery_date" name="delivery_date" type="date" min="2026-09-30" required>
        </label>
        <label>Delivery area
          <select id="area" name="area" required>
<!--AREA_OPTIONS-->
          </select>
        </label>
        <label>Customer name <span>Optional. Used only for the draft greeting; it never changes the price.</span>
          <input id="customer" name="customer" type="text" autocomplete="off">
        </label>
        <button id="submit" type="submit">Calculate quote</button>
      </form>
      <p id="error" class="error" hidden></p>
    </section>

    <section id="results" class="card" hidden>
      <h2>Quote</h2>
      <table>
        <tr><td id="boxes-line">Boxes</td><td id="boxes-total"></td></tr>
        <tr><td>Price per box</td><td id="price-per-box"></td></tr>
        <tr><td>Delivery fee</td><td id="delivery-fee"></td></tr>
        <tr><td id="gst-label">GST</td><td id="gst"></td></tr>
        <tr class="total"><td>Total payable</td><td id="total"></td></tr>
      </table>
    </section>

    <section id="draft-card" class="card" hidden>
      <h2>AI-drafted quotation</h2>
      <div class="banner">Draft for Priya Menon's approval. Not sent.</div>
      <pre id="draft"></pre>
      <p id="draft-status" class="muted" hidden></p>
    </section>
  </main>

  <script>
    const money = (value) => "S$" + Number(value).toLocaleString("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const $ = (id) => document.getElementById(id);

    $("quote-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("error").hidden = true;
      $("submit").disabled = true;
      $("submit").textContent = "Calculating and drafting...";
      try {
        const response = await fetch("/api/quote", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            boxes: $("boxes").value,
            delivery_date: $("delivery_date").value,
            area: $("area").value,
            customer: $("customer").value,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not calculate the quote");

        const q = data.quote;
        $("boxes-line").textContent = `${q.boxes} boxes x ${money(q.price_per_box)}`;
        $("boxes-total").textContent = money(q.boxes_total);
        $("price-per-box").textContent = money(q.price_per_box);
        $("delivery-fee").textContent = `${money(q.delivery_fee)} (${q.area})`;
        $("gst-label").textContent = `GST (${q.gst_rate}%)`;
        $("gst").textContent = money(q.gst);
        $("total").textContent = money(q.total);
        $("results").hidden = false;

        const d = data.draft;
        $("draft").textContent = d.email || "";
        $("draft").hidden = !d.email;
        $("draft-status").textContent = d.email ? "" : d.message;
        $("draft-status").hidden = !!d.email;
        $("draft-card").hidden = false;
      } catch (err) {
        $("error").textContent = err.message;
        $("error").hidden = false;
        $("results").hidden = true;
        $("draft-card").hidden = true;
      } finally {
        $("submit").disabled = false;
        $("submit").textContent = "Calculate quote";
      }
    });
  </script>
</body>
</html>
